[package]
name = "llmouser"
description = "The browser that generates websites with an LLM instead of real HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "llmouser"
build = "build.rs"

[[bin]]
name = "llmouser"
path = "src/main.rs"

[dependencies]
llmouser-browser = { version = "3.0.0", path = "../browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
webkit6 = { version = "0.6", features = ["v2_44"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_SystemServices",
] }
windows-core = "0.62"
webview2-com = "0.39"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "llmouser"
maintainer = "Vladimir Kiselev"
copyright = "2026, Vladimir Kiselev"
license-file = ["../../LICENSE", "0"]
extended-description = "A browser where typing an address loads a webpage generated by an LLM instead of fetched over HTTP."
section = "web"
priority = "optional"
depends = "$auto, librsvg2-common"
assets = [
    ["target/release/llmouser", "usr/bin/", "755"],
    ["../../packaging/linux/llmouser.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon.png", "usr/share/icons/hicolor/512x512/apps/llmouser.png", "644"],
    ["../../README.md", "usr/share/doc/llmouser/README", "644"],
]

[package.metadata.bundle]
name = "LLMouser"
identifier = "com.nettsundere.llmouser"
icon = ["../../assets/icon-mac.png"]
category = "public.app-category.utilities"
copyright = "© 2026 Vladimir Kiselev. MIT License"
osx_minimum_system_version = "11.0"
